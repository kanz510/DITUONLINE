name: Phase 2 - Full game and GLB validation
on:
  push:
    branches: [verify/phase2-special-models-20261103]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase2-prison-asset-screenshots
          path: |
            screenshots/
            test-results/
          if-no-files-found: warn
