name: Check live Pages v0.4.3 Phase 2
on:
  push:
    branches: [verify/phase2-special-models-20261103]
    paths: [.github/workflows/phase2-live-check.yml]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Verify public HTTP release and HTML
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://kanz510.github.io/DITUONLINE"
          for i in $(seq 1 16); do
            T="$(date +%s)-${i}"
            for DIR in "$BASE" "$BASE/dist"; do
              JSON="$(curl -fsSL --connect-timeout 10 --max-time 20 -H 'Cache-Control: no-cache' "${DIR}/release.json?verify=${T}" || true)"
              HTML="$(curl -fsSL --connect-timeout 10 --max-time 20 -H 'Cache-Control: no-cache' "${DIR}/?verify=${T}" || true)"
              echo "Attempt ${i} ${DIR} release ${JSON:0:190}"
              if printf '%s' "$JSON" | grep -Eq '"version"[[:space:]]*:[[:space:]]*"0[.]4[.]3"' &&
                 printf '%s' "$JSON" | grep -q 'd8dcb3385193' &&
                 printf '%s' "$HTML" | grep -q 'd8dcb3385193'; then
                echo "PASS public Pages v0.4.3 (d8dcb3385193) at ${DIR}/"
                exit 0
              fi
            done
            sleep 10
          done
          echo "Public release not confirmed"
          exit 1
