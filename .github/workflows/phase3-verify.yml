name: Phase 3 full QA (architecture + PBR + lights + weather + performance)
on:
  push:
    branches:
      - verify/phase3-all-20261103
    paths:
      - '.github/workflows/phase3-verify.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Complete tests including 3D screenshots
        run: npm test
      - name: Production TypeScript + Vite build
        run: npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase3-iphone-landscape-screenshots
          path: |
            screenshots/
            test-results/
          if-no-files-found: warn
