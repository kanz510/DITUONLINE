name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    # A generated-assets commit re-triggers branch-based Pages, but must not rebuild itself.
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, 'build(pages): sync generated files') }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit

      - name: Build production bundle
        run: npm run build

      # This repository ALSO has branch-based Pages (Jekyll) enabled.
      # Keep tracked dist/ in sync with the Vite build so either Pages deploy serves
      # the same fresh code. The generated commit is skipped by this workflow.
      - name: Sync generated site for branch-based Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A dist sw.js release.json
          if ! git diff --cached --quiet; then
            git commit -m "build(pages): sync generated files"
            git push origin HEAD:main
          fi

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
